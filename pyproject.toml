[project]
name = "incident-runbook-triage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
    "langgraph>=1.2.20",
    "redis>=8.1.0",
    "rq>=3.0.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "langchain-groq>=1.1.3",
    "fastembed>=0.9.1",
    "faiss-cpu>=1.16.0",
    "filelock>=4.2.10",
]

[dependency-groups]
dev = [
    "locust>=2.47.0",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
