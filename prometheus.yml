global:
  scrape_interval: 15s

scrape_configs:
  - job_name: incident-triage-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: irt-prometheus
    static_configs:
      - targets: ["irt-prometheus:9090"]

  - job_name: irt-postgres
    static_configs:
      - targets: ["irt-postgres-exporter:9187"]
